<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <metas
        name="description"
        content="Calculadora simples desenvolvida com HTML, CSS e JavaScript."
    >

    <title>Calculadora | Lucas Neves</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/index.js" defer></script>
</head>

<body>
    <header class="header">
        <h1>Calculadora</h1>
        <p>Uma calculadora simples feita com JavaScript</p>
    </header>

    <main>
        <section class="calculator" aria-label="Calculadora">
            <label for="result" class="visually-hidden">
                Visor da calculadora
            </label>

            <input
                type="text"
                id="result"
                class="display"
                placeholder="0"
                readonly
                aria-live="polite"
            >

            <div class="buttons">
                <button type="button" class="button" data-value="7">7</button>
                <button type="button" class="button" data-value="8">8</button>
                <button type="button" class="button" data-value="9">9</button>
                <button type="button" class="button operator" data-value="/">÷</button>

                <button type="button" class="button" data-value="4">4</button>
                <button type="button" class="button" data-value="5">5</button>
                <button type="button" class="button" data-value="6">6</button>
                <button type="button" class="button operator" data-value="*">×</button>

                <button type="button" class="button" data-value="1">1</button>
                <button type="button" class="button" data-value="2">2</button>
                <button type="button" class="button" data-value="3">3</button>
                <button type="button" class="button operator" data-value="-">−</button>

                <button type="button" class="button" data-value="0">0</button>
                <button type="button" class="button" data-value=".">.</button>
                <button type="button" class="button equals" data-action="calculate">=</button>
                <button type="button" class="button operator" data-value="+">+</button>
            </div>

            <div class="actions">
                <button type="button" class="button clear" data-action="clear">
                    Limpar tudo
                </button>

                <button type="button" class="button delete" data-action="delete">
                    Apagar último
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            Desenvolvido por
            <a
                href="https://github.com/Taunt-byte"
                target="_blank"
                rel="noopener noreferrer"
            >Lucas Neves</a>
        </p>
    </footer>
</body>
</html>
